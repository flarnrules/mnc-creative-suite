<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MNC Creative Suite</title>
  <style>
    :root { color-scheme: dark; font: 100% system-ui, sans-serif; }
    body { margin: 0; background: #171a17; color: #efe8d5; }
    main { margin: min(16vh, 7rem) auto 3rem; max-width: 39rem; padding: 0 1.25rem; }
    h1 { margin: .35rem 0 .9rem; font: 500 clamp(2.1rem, 8vw, 3.6rem)/1.08 Georgia, serif; }
    p { color: #c4c8bb; line-height: 1.55; }
    .club { color: #d5bd89; font-weight: 600; }
    nav { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1.6rem 0; }
    a { padding: .7rem 1.05rem; border: 1px solid #666b59; border-radius: .4rem; color: #efe8d5; text-decoration: none; }
    nav a:first-child { background: #dbc495; border-color: #dbc495; color: #201a14; font-weight: 650; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid #f5e1bc; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="club">Movie Night Club</div>
    <h1>Creative Suite</h1>
    <p>Design trading cards, explore foil and fractal finishes, and prepare print sheets.</p>
    <nav aria-label="Movie Night Club sites">
      <a href="./studio/">Open Creative Suite</a>
      <a href="https://flarnrules.github.io/mnc-db/">Open MNCDB</a>
    </nav>
    <p>Add your own art and design a card. Your edits save in this browser. To send an editable copy, use <strong>Project &amp; Backup → Export project JSON</strong>.</p>
  </main>
</body>
</html>
